name: Refresh CDN copies
# The draw odds page loads tool/ and data/ from jsDelivr @main. After every push to main,
# clear jsDelivr's cache for the changed files so the site shows them within minutes.
on:
  push:
    branches: [main]
    paths: ['data/**', 'tool/**']
  workflow_call:
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Purge changed files
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- data tool 2>/dev/null || true)
          [ -z "$files" ] && files=$(git ls-files data tool)
          for f in $files; do
            echo "purge $f"
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" >/dev/null || echo "purge failed for $f"
          done
