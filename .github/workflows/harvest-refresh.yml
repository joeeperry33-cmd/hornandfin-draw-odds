name: Refresh hunter success
# Checks each state's official harvest reports and updates data/harvest/<state>.json
# when a newer or corrected report is out. Reports come out Feb to Jun, so it runs
# weekly then and on the 1st of the month the rest of the year.
on:
  schedule:
    - cron: '17 14 * 2-6 1'   # Mondays 14:17 UTC, Feb to Jun
    - cron: '17 14 1 * *'     # 1st of every month
  workflow_dispatch:
    inputs:
      states: { description: 'States to refresh (blank = all)', required: false, default: '' }
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install headless Chromium (Colorado's reports open in a JavaScript viewer)
        run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Refresh WY, UT, ID, OR, CO
        id: run
        continue-on-error: true
        run: set -o pipefail; python3 scripts/harvest/refresh.py ${{ inputs.states || 'wy ut id or co nm nv' }} | tee refresh.log
      - name: Rebuild state hub summaries
        run: |
          python3 scripts/hub/build.py
          node scripts/national/build.js
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/harvest data/hub data/national; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "harvest-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/harvest data/hub data/national
          git commit -m "Refresh hunter success from state harvest reports"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Fail the run if a state could not be refreshed
        if: steps.run.outcome == 'failure'
        run: |
          grep -E 'ERROR|NOT updated' refresh.log || true
          exit 1
  purge:
    needs: refresh
    if: always() && needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/purge-cdn.yml
